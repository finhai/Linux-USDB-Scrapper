name: Desktop packages
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, prod]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: uv sync --locked
      - run: uv run python scripts/build_desktop.py
      - if: runner.os == 'Linux'
        run: dist/USDB-Scrapper/USDB-Scrapper --version && tar -czf dist/USDB-Scrapper-linux.tar.gz -C dist USDB-Scrapper
      - if: runner.os == 'Windows'
        run: dist/USDB-Scrapper/USDB-Scrapper.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: USDB-Scrapper-${{ runner.os }}
          path: |
            dist/USDB-Scrapper-linux.tar.gz
            dist/USDB-Scrapper/
