[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "usdb-scrapper-linux"
version = "1.0.0"
description = "Desktop UltraStar library manager for Linux and Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock>=3.20,<4",
    "httpx>=0.28,<0.29",
    "keyring>=25,<26",
    "pillow>=11,<13",
    "psutil>=7,<8",
    "PySide6>=6.8,<7",
    "yt-dlp[default]>=2026.3.17",
]

[project.scripts]
usdb-scrapper = "usdb_scrapper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-psutil>=7.2.2.20260906",
    "pyinstaller>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usdb_scrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
